services:
  - type: web
    name: kundalik-yordamchimm
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && python manage.py seed_services && gunicorn config.wsgi:application --workers ${WEB_CONCURRENCY:-2} --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kundalik-yordamchi-db
          property: connectionString

databases:
  - name: kundalik-yordamchi-db
    databaseName: kundalik_yordamchi
    plan: free
    region: singapore

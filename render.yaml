services:
  - type: web
    name: kundalik-yordamchimm
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: kundalik-yordamchi-db
          property: connectionString

databases:
  - name: kundalik-yordamchi-db
    databaseName: kundalik_yordamchi
    plan: free
    region: singapore

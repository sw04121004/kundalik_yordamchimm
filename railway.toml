[build]
buildCommand = "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt && python manage.py collectstatic --no-input --clear && python manage.py migrate"
runCommand = "cd backend && gunicorn config.wsgi:application --workers ${WEB_CONCURRENCY:-2} --bind 0.0.0.0:${PORT:-8000}"

[deploy]
rootDirectory = "/"